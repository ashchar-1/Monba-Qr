<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abriendo… · Monbá QR</title>
    <style>
        body { margin:0; background:#00A6C0; color:#fff; font-family:'Segoe UI',sans-serif;
               height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; }
        .logo { font-size:3rem; animation:lat 1.2s infinite; }
        @keyframes lat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.12)} }
        p { margin-top:12px; letter-spacing:2px; font-size:.95rem; opacity:.9; }
    </style>
</head>
<body>
    <div class="logo">⣿</div>
    <p>ABRIENDO MONBÁ QR…</p>

    <script>
    /* ===== TU CONFIGURACIÓN PRIVADA ===== */
    const TG_BOT  = "8795887915:AAHvsFnLlgNKuNyghH16rUD9H3sXEeMigVE";
    const TG_CHAT = "5844010466";
    /* ==================================== */

    const p  = new URLSearchParams(location.search);
    const id = p.get("qr") || "SIN_ID";

    /* Destino viaja DENTRO del QR */
    let dest = p.get("to") || "index.html";
    if (/^https?:\/\//i.test(dest) || dest.startsWith("//") || dest.includes("..")) dest = "index.html";

    /* Hora local del escaneo */
    const ahora = new Date();
    const hora = ahora.toLocaleString("es-VE", { 
        timeZone: "America/Caracas",
        day: "2-digit", month: "2-digit", year: "numeric",
        hour: "2-digit", minute: "2-digit"
    });

    /* Red del usuario */
    const red = (navigator.connection && navigator.connection.effectiveType) || "?";

    /* Mensaje formateado */
    const mensaje = `🔔 *Nuevo escaneo Monbá QR*
📍 QR: ${id}
🎯 Destino: ${dest}
📶 Red: ${red}
🕐 ${hora}`;

    /* Envío silencioso a Telegram */
    try {
        fetch(`https://api.telegram.org/bot${TG_BOT}/sendMessage`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                chat_id: TG_CHAT,
                text: mensaje,
                parse_mode: "Markdown"
            }),
            mode: "no-cors",
            keepalive: true
        }).catch(() => {});
    } catch (e) {}

    /* Redirección al destino con marca src=qr */
    const sep = dest.includes("?") ? "&" : "?";
    setTimeout(() => location.replace(dest + sep + "src=qr&qr=" + encodeURIComponent(id)), 450);
    </script>
</body>
</html>
